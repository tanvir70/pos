name: CI/CD Pipeline - Rajib Enterprise POS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Quality Gates & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend-python/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-python/requirements.txt

      - name: Run Backend Quality Gate (pytest 100% Pass)
        run: |
          cd backend-python
          PYTHONPATH=. python -m pytest tests/ -v

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile || pnpm install

      - name: Run Frontend TypeCheck (0 Errors)
        run: |
          cd frontend
          pnpm exec tsc --noEmit

      - name: Build Frontend Production SPA
        run: |
          cd frontend
          pnpm run build

      - name: Sync Frontend Assets to Backend Distribution
        run: |
          rm -rf backend-python/dist
          cp -r frontend/dist backend-python/dist

      - name: Package Production Deployment Bundle
        run: |
          cd backend-python
          zip -q -r ../deploy.zip \
            app \
            dist \
            alembic \
            alembic.ini \
            run.py \
            passenger_wsgi.py \
            requirements.txt \
            -x "*/__pycache__/*" "*.pyc" "*.db*" "logs/*" ".env*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy.zip
          retention-days: 1

  deploy-to-cpanel:
    name: Deploy to cPanel
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: Check Deployment Credentials
        id: check-secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          if [ -n "$CPANEL_HOST" ] && [ -n "$CPANEL_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "cPanel SSH credentials found. Automated deployment will proceed."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cPanel SSH credentials (CPANEL_SSH_HOST, CPANEL_SSH_KEY) are not set in GitHub repository secrets. Deployment bundle deploy.zip was successfully built and saved as an artifact."
          fi

      - name: Deploy to cPanel via SSH / SCP
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER || 'rajibent' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "deploy.zip"
          target: ${{ secrets.CPANEL_REMOTE_DIR || '/home/rajibent/backend-python' }}

      - name: Remote Extraction & Service Reload
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER || 'rajibent' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            REMOTE_DIR="${{ secrets.CPANEL_REMOTE_DIR || '/home/rajibent/backend-python' }}"
            VENV_PYTHON="${{ secrets.CPANEL_VENV_PYTHON || '/home/rajibent/virtualenv/backend-python/3.12/bin/python' }}"
            cd "$REMOTE_DIR"

            # Clean old hashed assets to prevent accumulation
            rm -rf dist/assets/

            # Unzip production bundle (never overwrites pos.db because pos.db is excluded from zip)
            unzip -qo deploy.zip
            rm -f deploy.zip

            # Update dependencies & run schema migrations if venv is present
            if [ -f "$VENV_PYTHON" ]; then
              "$VENV_PYTHON" -m pip install -q -r requirements.txt || true
              "$VENV_PYTHON" -m alembic upgrade head || true
            fi

            # 1. Phusion Passenger Zero-Downtime Reload
            mkdir -p tmp
            touch tmp/restart.txt

            # 2. Standalone Daemon Reload (if running python run.py background process)
            pkill -f "python run.py" 2>/dev/null || true
            sleep 1
            if [ -f "$VENV_PYTHON" ]; then
              nohup "$VENV_PYTHON" run.py > "$REMOTE_DIR/uvicorn.log" 2>&1 &
            fi
            sleep 2

            echo "✓ Deployment complete and service reload triggered on cPanel."
