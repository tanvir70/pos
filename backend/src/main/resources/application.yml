server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:posdb}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    owner-pin: "1234"
    jwt:
      secret: "SyngentaEnterprisePosSystemSecureKey2026SecureSecretForHmacSha256MustBe32BytesOrLonger"
      expiration-ms: 86400000
  cors:
    allowed-origins:
      - "http://localhost:8443"
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:8443"
      - "http://127.0.0.1:5173"
      - "http://127.0.0.1:3000"

