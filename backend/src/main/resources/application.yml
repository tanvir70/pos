server:
  port: 8080

spring:
  application:
    name: pos-backend
  datasource:
    url: jdbc:h2:file:./data/posdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    owner-pin: "1234"
    jwt:
      secret: "SyngentaEnterprisePosSystemSecureKey2026SecureSecretForHmacSha256MustBe32BytesOrLonger"
      expiration-ms: 86400000
  cors:
    allowed-origins:
      - "http://localhost:8443"
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:8443"
      - "http://127.0.0.1:5173"
      - "http://127.0.0.1:3000"

