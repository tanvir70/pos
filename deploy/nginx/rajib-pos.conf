server {
    listen 80;
    server_name pos.yourdomain.com;

    # Gzip compression for high-performance SPA delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Client upload limits for challan documents and backup restore
    client_max_body_size 50M;

    # Backend API & Dynamic Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Immutable Frontend Assets (Hashed JS, CSS, Fonts, Images)
    location /assets/ {
        proxy_pass http://127.0.0.1:8000/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Root & HTML Fallback
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
